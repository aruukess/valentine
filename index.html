<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Valentine Letter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Сердечки на фоне -->
    <div class="hearts">
        ♥　♥　♥　♥　♥　♥　♥　♥
    </div>

    <!-- Главное окно -->
    <main class="window">

        <!-- Верхняя часть окна -->
        <div class="top-bar">
            <span>LOVE</span>
            <span>— □ ×</span>
        </div>

        <!-- Сердечки сверху -->
        <div class="decor">
            ♥　 ♥　 ♥
        </div>

        <!-- Основная часть -->
        <section class="letter">

            <p class="question">
                Will you be my Valentine?
            </p>

            <!-- Пиксельный котик -->
            <div class="pixel-cat">

                <div class="cat-ear left"></div>
                <div class="cat-ear right"></div>

                <div class="cat-head">

                    <span class="eye left-eye">■</span>
                    <span class="eye right-eye">■</span>

                    <span class="nose">♥</span>

                </div>

                <div class="cat-body"></div>

                <div class="cat-tail"></div>

            </div>

            <!-- Красное сердечко -->
            <div class="heart">
                ♥
            </div>

            <!-- Кнопки -->
            <div class="buttons">

                <button id="yesBtn">
                    YES
                </button>

                <div class="no-wrapper">

                    <button id="noBtn">
                        NO
                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- Сообщение -->
    <div id="message" class="message">
         Я так и знала! 
    </div>

    <script src="script.js"></script>

</body>

</html>
